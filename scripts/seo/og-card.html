<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Thomas Carr, Ph.D. — social card source</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden;background:#050807}
  .card{
    position:relative;width:1200px;height:630px;
    display:flex;flex-direction:column;justify-content:center;
    padding:0 88px;color:#e9efec;
    background:
      radial-gradient(900px 520px at 78% 8%, rgba(16,185,129,.20), transparent 62%),
      radial-gradient(760px 460px at 8% 104%, rgba(212,168,83,.14), transparent 60%),
      #050807;
  }
  /* faint skeletal grid — nods to the motion-capture subject matter */
  .grid{
    position:absolute;inset:0;opacity:.05;
    background-image:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);
    background-size:56px 56px;
    -webkit-mask-image:radial-gradient(760px 460px at 70% 40%,#000,transparent 78%);
            mask-image:radial-gradient(760px 460px at 70% 40%,#000,transparent 78%);
  }
  .inner{position:relative}
  .kicker{
    font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;
    font-size:19px;letter-spacing:.30em;text-transform:uppercase;
    color:#10b981;margin-bottom:26px;
  }
  h1{
    font-family:'DM Serif Display',Georgia,serif;
    font-size:104px;line-height:1.02;letter-spacing:.005em;font-weight:400;
  }
  .rule{
    width:132px;height:3px;margin:30px 0 28px;border-radius:2px;
    background:linear-gradient(90deg,#d4a853,#e8c075 52%,#d4a853);
  }
  .role{
    font-family:'Inter',-apple-system,sans-serif;
    font-size:31px;font-weight:600;color:#cfe0d8;line-height:1.35;
  }
  .topics{
    font-family:'Inter',-apple-system,sans-serif;
    font-size:24px;color:#93a49c;margin-top:14px;line-height:1.4;
  }
  .foot{
    position:absolute;left:88px;right:88px;bottom:52px;
    display:flex;justify-content:space-between;align-items:center;
    font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;
    font-size:20px;color:#7e8f88;
    border-top:1px solid rgba(255,255,255,.10);padding-top:22px;
  }
  .foot .site{color:#d4a853}
</style>
</head>
<body>
  <div class="card">
    <div class="grid"></div>
    <div class="inner">
      <div class="kicker">AI Researcher &middot; Privacy + ML</div>
      <h1>Thomas Carr, Ph.D.</h1>
      <div class="rule"></div>
      <div class="role">Lead AI &amp; Software Engineer, Incerta Intelligence</div>
      <div class="topics">Privacy-preserving ML &middot; Skeleton-motion anonymization &middot; UNC Charlotte</div>
    </div>
    <div class="foot">
      <span class="site">thomasc.tech</span>
      <span>ORCID 0009-0006-6039-0209</span>
    </div>
  </div>
</body>
</html>
